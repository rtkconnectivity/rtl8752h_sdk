/*----------------------------------------------------------------------------
  OnResetExec()  Clear AON reg 0x0 to do whole reset
 *----------------------------------------------------------------------------*/
 FUNC void OnResetExec(void) {  //Reset Callback
  _WDWORD(0x40000048, 0x0);
  _WDWORD(0x40000048, 0x1);	
  _WDWORD(0x40000048, 0x0);
}
 
 
FUNC void Setup (void) {
  OnResetExec();
}


Setup();                             // Setup for Running
